# Builds the standalone Hermes IDE installer and publishes it, with the update feed, as a GitHub Release.
# Trigger: push a tag that matches package.json, e.g. `git tag v0.4.0 && git push origin v0.4.0`.
# The in-IDE updater reads https://github.com/<owner>/<repo>/releases/latest/download/latest.json (ide/brand.json).
name: Release IDE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($expected)" >&2
            exit 1
          fi

      # x64 only: the arm64 build path exists in ide/scripts/build.mjs but has not been tested on real hardware.
      - name: Build installer and update feed
        run: node ide/scripts/build.mjs --release --arch x64

      - name: Smoke test the staged IDE
        run: node ide/scripts/smoke.mjs --timeout 120

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-ide-windows
          path: |
            ide/out/x64/HermesIDE-Setup-*.exe
            ide/out/x64/HermesIDE-Setup-*.exe.sha256
            ide/out/latest.json
            hermes-ide-*.vsix

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ide/out/x64/HermesIDE-Setup-*.exe \
            ide/out/x64/HermesIDE-Setup-*.exe.sha256 \
            ide/out/latest.json \
            hermes-ide-*.vsix \
            --title "Hermes IDE $GITHUB_REF_NAME" --generate-notes

      # Public and irreversible (a version can never be reused), so it is opt-in: set the repository variable
      # PUBLISH_OPENVSX=true and the secret OVSX_PAT, and decide the license first (the script refuses UNLICENSED).
      - name: Publish extension to Open VSX
        if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_OPENVSX == 'true'
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npm run publish:openvsx
